<div class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-6">
    <h3 class="text-lg font-semibold text-gray-800 mb-5">{{ isEdit ? "Edit Agent" : "Create Agent" }}</h3>
    <div class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1.5">User <span class="text-red-500">*</span></label>
        <select [(ngModel)]="userId" class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-[#853953] bg-white">
          <option [value]="0" disabled>Select a user</option>
          @for (u of users(); track u.id) {
            <option [value]="u.id">{{ u.name }} ({{ u.email }})</option>
          }
        </select>
        @if (userId === 0) {
          <p class="text-xs text-gray-400 mt-1">A user is required.</p>
        }
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1.5">License Number <span class="text-red-500">*</span>  <span class="text-gray-400 font-normal">(min 3 chars)</span></label>
        <input [(ngModel)]="licenseNumber" type="text" placeholder="e.g. LIC-001" class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-[#853953]" />
        @if (licenseNumber.trim().length > 0 && licenseNumber.trim().length < 3) {
          <p class="text-xs text-red-500 mt-1">License number must be at least 3 characters.</p>
        }
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1.5">Region</label>
        <select [(ngModel)]="region" class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-[#853953] bg-white">
          @for (r of regions; track r) {
            <option [value]="r">{{ r }}</option>
          }
        </select>
      </div>
    </div>
    <div class="flex gap-3 justify-end mt-6">
      <button (click)="onCancel()" class="px-4 py-2 text-sm border border-gray-200 rounded-lg hover:bg-gray-50">Cancel</button>
      <button (click)="onSave()" [disabled]="!isValid" class="px-4 py-2 text-sm text-white bg-[#853953] rounded-lg hover:bg-[#612D53] disabled:opacity-50 disabled:cursor-not-allowed">{{ isEdit ? "Save" : "Create" }}</button>
    </div>
  </div>
</div>
