<div class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl shadow-xl w-full max-w-sm p-6">
    <h3 class="text-lg font-semibold text-gray-800 mb-5">Change User Status</h3>
    <div class="mb-5">
      <label class="block text-sm font-medium text-gray-700 mb-2">Status</label>
      <select
        [(ngModel)]="selectedStatus"
        class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-[#853953] focus:ring-1 focus:ring-[#853953] bg-white"
      >
        <option value="ACTIVE">ACTIVE</option>
        <option value="INACTIVE">INACTIVE</option>
      </select>
    </div>
    <div class="flex gap-3 justify-end">
      <button (click)="onCancel()" class="px-4 py-2 text-sm text-gray-600 border border-gray-200 rounded-lg hover:bg-gray-50">Cancel</button>
      <button (click)="onSave()" class="px-4 py-2 text-sm text-white bg-[#853953] rounded-lg hover:bg-[#612D53]">Save</button>
    </div>
  </div>
</div>
