<div class="fixed inset-0 z-50 flex items-center justify-center">
  <div class="absolute inset-0 bg-black/50" (click)="onCancel()"></div>
  <div class="relative bg-white rounded-2xl shadow-xl w-full max-w-md mx-4">
    <div class="flex items-center justify-between px-6 py-4 border-b border-gray-100">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 bg-[#853953] rounded-lg flex items-center justify-center">
          <span class="material-icons text-white text-sm">pool</span>
        </div>
        <h2 class="text-lg font-semibold text-gray-800">{{ isEdit ? 'Edit Risk Pool' : 'Add Risk Pool' }}</h2>
      </div>
      <button (click)="onCancel()" class="p-1 text-gray-400 hover:text-gray-600 rounded-lg transition-colors">
        <span class="material-icons text-xl">close</span>
      </button>
    </div>
    <div class="px-6 py-5 space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Disaster Type</label>
        @if (isEdit) {
          <input [value]="disasterType" disabled class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm bg-gray-100 cursor-not-allowed">
        } @else {
          <input [(ngModel)]="disasterType" type="text" placeholder="e.g. FLOOD, CYCLONE, TSUNAMI"
            class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-[#853953]">
        }
      </div>
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Premium Collected (₹)</label>
          <input [(ngModel)]="totalPremiumCollected" type="number" min="0"
            class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-[#853953]">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Claims Paid (₹)</label>
          <input [(ngModel)]="totalClaimsPaid" type="number" min="0"
            class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-[#853953]">
        </div>
      </div>
      @if (isEdit) {
        <div class="bg-[#F3F4F4] px-4 py-3 rounded-xl border border-[#853953]/20">
          <label class="block text-sm font-medium text-[#612D53] mb-1">Inject Govt/Org Funds (₹)</label>
          <input [(ngModel)]="addFundsAmount" (ngModelChange)="updateTotal()" type="number" min="0" placeholder="e.g. 1000000"
            class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-[#853953] bg-white">
          <p class="text-xs text-gray-500 mt-1.5">This gets directly added to Premium Collected above.</p>
        </div>
      }
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Threshold: {{ thresholdPercentage }}%</label>
        <input [(ngModel)]="thresholdPercentage" type="range" min="1" max="100" class="w-full accent-[#853953]">
        <div class="flex justify-between text-xs text-gray-400 mt-1"><span>1%</span><span>100%</span></div>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Pool Status</label>
        <select [(ngModel)]="poolStatus" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-[#853953]">
          @for (s of statuses; track s) { <option [value]="s">{{ s }}</option> }
        </select>
      </div>
    </div>
    <div class="flex gap-3 px-6 py-4 border-t border-gray-100 bg-gray-50 rounded-b-2xl">
      <button (click)="onCancel()" class="flex-1 px-4 py-2 border border-gray-200 rounded-lg text-sm text-gray-600 hover:bg-white transition-colors">Cancel</button>
      <button (click)="onSave()" [disabled]="!isValid" class="flex-1 px-4 py-2 bg-[#853953] text-white rounded-lg text-sm font-medium hover:bg-[#612D53] transition-colors disabled:opacity-50">
        {{ isEdit ? 'Save Changes' : 'Create Pool' }}
      </button>
    </div>
  </div>
</div>
