<div class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-6">
    <h3 class="text-lg font-semibold text-gray-800 mb-1">Policy Decision</h3>
    <p class="text-xs text-gray-500 font-mono mb-5">{{ policy.policyNumber }}</p>
    <div class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1.5">Decision</label>
        <select [(ngModel)]="decision" class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-[#853953] bg-white">
          <option value="APPROVED">APPROVED</option>
          <option value="REJECTED">REJECTED</option>
        </select>
      </div>
    </div>
    <div class="flex gap-3 justify-end mt-6">
      <button (click)="onCancel()" class="px-4 py-2 text-sm border border-gray-200 rounded-lg hover:bg-gray-50">Cancel</button>
      <button (click)="onSave()" class="px-4 py-2 text-sm text-white bg-[#853953] rounded-lg hover:bg-[#612D53]">Save Decision</button>
    </div>
  </div>
</div>
