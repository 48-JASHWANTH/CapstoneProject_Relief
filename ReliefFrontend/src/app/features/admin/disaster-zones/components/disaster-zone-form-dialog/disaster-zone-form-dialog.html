<div class="fixed inset-0 z-50 flex items-center justify-center"><div class="absolute inset-0 bg-black/50" (click)="onCancel()"></div><div class="relative bg-white rounded-2xl shadow-xl w-full max-w-md mx-4"><div class="flex items-center justify-between px-6 py-4 border-b border-gray-100"><div class="flex items-center gap-3"><div class="w-9 h-9 bg-[#853953] rounded-lg flex items-center justify-center"><span class="material-icons text-white text-sm">place</span></div><h2 class="text-lg font-semibold text-gray-800">{{ isEdit ? 'Edit Zone' : 'Add Disaster Zone' }}</h2></div><button (click)="onCancel()" class="p-1 text-gray-400 hover:text-gray-600 rounded-lg transition-colors"><span class="material-icons text-xl">close</span></button></div><div class="px-6 py-5 space-y-4"><div><label class="block text-sm font-medium text-gray-700 mb-1">Zone Name <span class="text-red-500">*</span></label><input [(ngModel)]="zoneName" type="text" placeholder="e.g. North Flood Zone" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-[#853953]"></div><div><label class="block text-sm font-medium text-gray-700 mb-1">Location <span class="text-red-500">*</span></label><select [(ngModel)]="location" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-[#853953]"><option *ngFor="let l of locations" [value]="l">{{ l }}</option></select></div><div class="grid grid-cols-2 gap-4"><div><label class="block text-sm font-medium text-gray-700 mb-1">Disaster Type</label><select [(ngModel)]="disasterType" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-[#853953]"><option *ngFor="let t of disasterTypes" [value]="t">{{ t }}</option></select></div><div><label class="block text-sm font-medium text-gray-700 mb-1">Risk Level</label><select [(ngModel)]="riskLevel" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-[#853953]"><option *ngFor="let l of riskLevels" [value]="l">{{ l }}</option></select></div></div></div><div class="flex gap-3 px-6 py-4 border-t border-gray-100 bg-gray-50 rounded-b-2xl"><button (click)="onCancel()" class="flex-1 px-4 py-2 border border-gray-200 rounded-lg text-sm text-gray-600 hover:bg-white transition-colors">Cancel</button><button (click)="onSave()" [disabled]="!zoneName || !location" class="flex-1 px-4 py-2 bg-[#853953] text-white rounded-lg text-sm font-medium hover:bg-[#612D53] transition-colors disabled:opacity-50">{{ isEdit ? 'Save Changes' : 'Add Zone' }}</button></div></div></div>
