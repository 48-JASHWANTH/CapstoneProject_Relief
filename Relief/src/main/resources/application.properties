spring.application.name=Relief
# Server
server.port=8080

# H2 Database
spring.datasource.url=jdbc:h2:mem:reliefdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=root
spring.datasource.password=root

# Enable H2 Console
spring.h2.console.enabled=true

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# File Upload Limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Groq API via Spring AI OpenAI-compatible client (Spring AI 2.0.0-M2 requires both top-level and chat-specific keys)
spring.ai.openai.api-key=${GROQ_API_KEY}
spring.ai.openai.base-url=https://api.groq.com/openai
spring.ai.openai.chat.api-key=${GROQ_API_KEY}
spring.ai.openai.chat.base-url=https://api.groq.com/openai
spring.ai.openai.chat.options.model=llama-3.3-70b-versatile

# Google Cloud Vision API
gcp.project-id=relief-capstone
gcp.credentials.location=${GCP_CREDENTIALS_PATH}